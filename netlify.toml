[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/result-leads"
  to = "/.netlify/functions/result-leads"
  status = 200
  force = true

[[redirects]]
  from = "/api/track-event"
  to = "/.netlify/functions/track-event"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
